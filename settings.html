<div id="tavo_voice_settings" class="inline-drawer">
    <div class="inline-drawer-toggle inline-drawer-header">
        <span class="tavo-st-settings-title"><b>Tavo Voice Player</b><span class="tavo-st-version" data-plugin-version>v0.3.2</span></span>
        <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
    </div>
    <div class="inline-drawer-content">
        <div class="tavo-st-settings-grid">
            <label>API 地址
                <input class="text_pole" data-setting="baseUrl" type="url" spellcheck="false">
            </label>
            <label>API Key
                <input class="text_pole" data-setting="apiKey" type="password" autocomplete="off">
            </label>
            <label>模型
                <input class="text_pole" data-setting="model" type="text" spellcheck="false">
            </label>
            <label>播放内容
                <select class="text_pole" data-setting="playbackMode">
                    <option value="all">旁白和对白</option>
                    <option value="narrator">仅旁白</option>
                    <option value="dialogue">仅对白</option>
                </select>
            </label>

            <label>音频格式
                <select class="text_pole" data-setting="audioFormat">
                    <option value="wav">WAV</option>
                    <option value="mp3">MP3</option>
                </select>
            </label>
            <label>采样率
                <select class="text_pole" data-setting="sampleRate">
                    <option value="16000">16000 Hz</option>
                    <option value="24000">24000 Hz</option>
                    <option value="32000">32000 Hz</option>
                    <option value="44100">44100 Hz</option>
                </select>
            </label>
            <label>旁白语速
                <input class="text_pole" data-setting="speed" type="number" min="0.5" max="2" step="0.05">
            </label>
            <label>对白语速
                <input class="text_pole" data-setting="dialogueSpeed" type="number" min="0.5" max="2" step="0.05">
            </label>
            <label>语言增强
                <select class="text_pole" data-setting="languageBoost">
                    <option value="Chinese">中文</option>
                    <option value="auto">自动</option>
                </select>
            </label>
        </div>

        <details class="tavo-st-settings-details" open>
            <summary>角色音色</summary>
            <div class="tavo-st-settings-grid">
                <label>旁白
                    <select class="text_pole" data-setting="voices.narrator" data-voice-picker></select>
                </label>
                <label>主角
                    <select class="text_pole" data-setting="voices.protagonist" data-voice-picker></select>
                </label>
                <label>女主一
                    <select class="text_pole" data-setting="voices.heroine1" data-voice-picker></select>
                </label>
                <label>女主二
                    <select class="text_pole" data-setting="voices.heroine2" data-voice-picker></select>
                </label>
                <label>女主三
                    <select class="text_pole" data-setting="voices.heroine3" data-voice-picker></select>
                </label>
                <label>女主四
                    <select class="text_pole" data-setting="voices.heroine4" data-voice-picker></select>
                </label>
                <label>男NPC一
                    <select class="text_pole" data-setting="voices.maleNpc1" data-voice-picker></select>
                </label>
                <label>男NPC二
                    <select class="text_pole" data-setting="voices.maleNpc2" data-voice-picker></select>
                </label>
                <label>女NPC一
                    <select class="text_pole" data-setting="voices.femaleNpc1" data-voice-picker></select>
                </label>
                <label>女NPC二
                    <select class="text_pole" data-setting="voices.femaleNpc2" data-voice-picker></select>
                </label>
            </div>
            <div class="tavo-st-settings-hint">超过角色数量时，第五位及以后的女主使用女主四音色；第三位及以后的男、女 NPC 分别使用男NPC二、女NPC二音色。</div>
        </details>

        <details class="tavo-st-settings-details" open>
            <summary>朗读提示词</summary>
            <label class="tavo-st-check">
                <input data-setting="promptEnabled" type="checkbox">
                <span>把朗读规则注入当前聊天 AI</span>
            </label>
            <div class="tavo-st-settings-grid">
                <label>注入位置
                    <select class="text_pole" data-setting="promptPosition">
                        <option value="2">提示词之前</option>
                        <option value="0">提示词中</option>
                        <option value="1">聊天深度</option>
                    </select>
                </label>
                <label>注入角色
                    <select class="text_pole" data-setting="promptRole">
                        <option value="0">System</option>
                        <option value="1">User</option>
                        <option value="2">Assistant</option>
                    </select>
                </label>
                <label data-show-depth>聊天深度
                    <input class="text_pole" data-setting="promptDepth" type="number" min="0" max="10000" step="1">
                </label>
            </div>
            <section class="tavo-st-prompt-section" aria-labelledby="tavo-st-prompt-title">
                <div class="tavo-st-prompt-heading">
                    <div>
                        <div class="tavo-st-prompt-title" id="tavo-st-prompt-title">朗读规则</div>
                        <div class="tavo-st-prompt-description">角色拆分、旁白与对白、情绪、音效和停顿都在这一个提示词里。修改后会自动用于下一轮回复。</div>
                    </div>
                    <button class="menu_button" type="button" data-action="reset-prompt">恢复默认提示词</button>
                </div>
                <label class="tavo-st-prompt-input">提示词
                    <textarea class="text_pole textarea_compact tavo-st-prompt-textarea" data-setting="prompt" rows="18"></textarea>
                </label>
            </section>
            <div class="tavo-st-settings-actions">
                <label class="tavo-st-check">
                    <input data-setting="contextHideStructure" type="checkbox">
                    <span>用 HTML 注释隐藏朗读结构</span>
                </label>
            </div>
        </details>

        <div class="tavo-st-settings-actions">
            <button class="menu_button" type="button" data-action="clear-cache">清空音频缓存</button>
            <span class="tavo-st-settings-status" aria-live="polite"></span>
        </div>
    </div>
</div>
